<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pruebas · CrisPianist</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/pixelify-sans@5.3.0/index.css">
  <link rel="stylesheet" href="../css/palette.css">
  <link rel="stylesheet" href="../css/base.css">
  <style>
    .summary { font-size: 20px; font-weight: 600; }
    .pass { color: var(--ok-1); }
    .fail { color: var(--bad-1); }
    #results { list-style: none; padding: 0; font-size: 14px; }
    #results li { padding: 2px 0; }
    #results pre { margin: 2px 0 6px 20px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Pruebas de lógica</h1>
    <p id="summary" class="summary">Ejecutando…</p>
    <ul id="results"></ul>
  </main>
  <script type="module" src="tests.js"></script>
</body>
</html>
